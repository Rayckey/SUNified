name: Installation, contracts and learning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  assets-and-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the CPU agent workflow
        run: python -m pip install -e ".[assets,asset-tests,agents,isaac]"
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Test assets, MCP, recovery, task coverage and documentation links
        run: >-
          python -m pytest -q -ra --junitxml=reports/assets-agents.xml
          tests/asset_generation tests/agents tests/test_source_integrity.py tests/test_task_catalog.py tests/test_example_artifacts.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assets-agents-results
          path: reports/

  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mpc
            extras: agents,programs,mpc,isaac,tests
            tests: tests/test_bounded_ik.py tests/test_generated_drawer_verification.py tests/test_legacy_learned_program.py
          - name: bc
            extras: bc,data,agents,tests
            tests: tests/test_prior_checkpoint_metadata.py tests/test_drawer_policy_handoff.py
          - name: all
            extras: all,asset-tests
            tests: tests --ignore=tests/stage_dp3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU Torch for hosted tests
        run: python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install selected module dependencies
        run: python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Exercise the installed module
        run: python -m pytest -q -ra --junitxml=reports/${{ matrix.name }}.xml ${{ matrix.tests }}
      - name: Smoke-test public commands outside the checkout
        if: matrix.name == 'all'
        working-directory: ${{ runner.temp }}
        run: |
          kuafu --help
          kuafu agent tools
          kuafu tasks list
          python -m kuafu.bc.training.train_bc_prior_mlp --help
          python -m kuafu.sim2real.dp3 --help
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: module-${{ matrix.name }}-results
          path: reports/

  source-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the supported source distribution
        run: |
          python -m pip install build
          python -m build --sdist --outdir "$RUNNER_TEMP/distribution"
      - name: Install the archive in a fresh environment and check bundled resources
        run: python scripts/check_source_install.py --archive "$RUNNER_TEMP"/distribution/kuafu-*.tar.gz --output "$RUNNER_TEMP/source-install"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-install-report
          path: ${{ runner.temp }}/source-install/report.json
