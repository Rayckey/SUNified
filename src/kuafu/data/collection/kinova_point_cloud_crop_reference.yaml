    inlier_pct_total: 81.99431522894625
    distance_threshold_m: 0.006
    mean_abs_error_mm_total: 1.769059592049299
    p95_abs_error_mm_total: 4.354153809468452
    pixel_stride: 4
    workspace_for_fit:
      min_x: 0.0
      max_x: 0.9
      min_y: -0.6
      max_y: 0.6
      min_z: -0.08
      max_z: 0.18
