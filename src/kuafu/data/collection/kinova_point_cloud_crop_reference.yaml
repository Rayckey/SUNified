# Static Kinova point-cloud crop reference for collection scripts.
#
# This file is informational only. The collection scripts do not load it,
# write it into dataset outputs, or apply the table plane during collection.
# Zarr postprocessing uses Kuafu2Real/configs/pointcloud_clip.kinova_gen3.tableplane.yaml.
kind: kinova_point_cloud_crop_reference
robot: kinova_gen3
frame: robot_base
calculated_from:
  # Paths relative to the external deployment output directory.
  samples: rgbd_calibration_sets/kinova_depth_calibration_20260703_1233/samples.yaml
  calibration: kinova_pair_rgbd_calibration_20260703_1345/matlab/calibration.matlab.rgb_robot_depth.d415_1__d415_2.yaml
  intrinsics: kinova_pair_rgbd_calibration_20260703_1345/matlab/intrinsics/camera_intrinsics.matlab_combined_charuco.yaml

point_cloud_clip:
  workspace_min: [0.10, -0.60, -0.10]
  workspace_max: [0.65, 0.60, 0.50]

table_plane_filter:
