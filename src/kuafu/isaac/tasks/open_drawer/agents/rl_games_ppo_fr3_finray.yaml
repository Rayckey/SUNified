params:
  seed: 1216
  env:
    clip_actions: 1.0
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  mpc:
    use_absolute_progress_rewards: true
    use_relative_progress_rewards: true
    use_velocity_penalty: true
    use_time_penalty: true
    regularize_velocity_scale: 0.01
    regularize_time_scale: 0.001
    progress_rewards_scale: 1000.0
  network:
    name: actor_critic
    separate: true
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: true
    mlp:
      units:
      - 512
      - 256
      - 128
      - 64
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
  load_checkpoint: false
  load_path: ''
  config:
    name: Open-FR3FinRay-Drawer
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    kl_threshold: 0.05
    score_to_win: 100000000
    max_epochs: 15000
    save_best_after: 100
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.001
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 64
    minibatch_size: 8192
    mini_epochs: 8
    critic_coef: 4
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.0001
    train_dir: logs/rl_games/Open-FR3FinRay-Drawer
    full_experiment_name: 2026-02-18_22-45-44
