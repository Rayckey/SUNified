dataset:
  dataset: "src/kuafu/data/datasets/fr3_finray_table_drawer_damped.hdf5"
  demo: null
  obs_key: "full_state"
  action_mode: "absolute_ee"
  time_shift: -1
  val_fraction: 0.1
  split_mode: "random"
  seed: 1999

preprocessing:
  action_chunk_size: 30
  action_chunk_stride: 3
  obs_history: 1

model:
  hidden_dims: [1024,512,256,512,1024]
  activation: "relu"

optimization:
  lr: 1.0e-5
  weight_decay: 1.0e-5
  batch_size: 1024
  num_workers: 8
  num_epochs: 300
  save_every_n_epochs: 50
  grad_clip: 10.0

logging:
  log_dir: "logs/bc_prior_mlp"
  monitor_demo_index: null

auto_shift:
  epochs: 50
  batch_size: 512

sample_weighting:
  enabled: true
  obs_stage_index: -1
  default_weight: 1.0
  normalize: true
  weight_validation: true
  stage_weights: {}

critic_pretraining:
  enabled: false
  gamma: 0.99
  loss_coef: 1.0
  normalize_targets: true
