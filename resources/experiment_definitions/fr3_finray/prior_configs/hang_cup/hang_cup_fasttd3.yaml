dataset:
  # NOTE: this file is not present in src/kuafu/data/datasets/ at creation time —
  # point --agent_cfg / dataset.dataset at the hang_cup HDF5 you want to use.
  dataset: "src/kuafu/data/datasets/fr3_finray_table_hang_cup_damped_noise.hdf5"
  demo: null
  obs_key: "state"
  action_mode: "absolute_ee"
  time_shift: 0
  val_fraction: 0.1
  split_mode: "random"
  seed: 1999

preprocessing:
  # MUST be 1 for FastTD3 — TD3 acts one step at a time, no open-loop chunking
  action_chunk_size: 1
  action_chunk_stride: 1
  obs_history: 1

model:
  # Must match FastTD3 actor layout: (actor_hidden_dim, //2, //4)
  # Default --actor_hidden_dim 512 -> [512, 256, 128]
  hidden_dims: [2048, 1024, 512]
  activation: "relu"
  negative_slope: 0.01
  dropout: 0.0

optimization:
  lr: 3.0e-4
  weight_decay: 1.0e-5
  batch_size: 1024
  num_workers: 8
  num_epochs: 150
  save_every_n_epochs: 50
  grad_clip: 10.0

logging:
  log_dir: "logs/bc_prior_mlp/hang_cup_fasttd3"
  monitor_demo_index: null

replay:
  # Used by src/kuafu/isaac/tasks/train_fasttd3.py to seed replay before online RL starts.
  preload: true
  max_transitions: null
  # This dataset's rewards are uninformative for RL (MPC logs);
  # zero them out and let the critic learn only from online RL rewards.
  use_rewards: false
  # Inflate demo footprint in the shared replay buffer.  Demos are repeated
  # round-robin to fill the requested fraction / slots.  Only one of these
  # may be set; leave both null to fit demos exactly once (auto).
  preload_fraction: 0.5    # fill 50% of buffer_size with demos
  preload_slots: null
  verbose: true

auto_shift:
  epochs: 50
  batch_size: 512

sample_weighting:
  enabled: true
  obs_stage_index: -1
  default_weight: 1.0
  normalize: true
  weight_validation: false
  stage_weights: {}

critic_pretraining:
  # FastTD3 uses distributional twin Q-nets; BC scalar value head cannot transfer
  enabled: false
  gamma: 0.99
  loss_coef: 1.0
  normalize_targets: true
