dataset:
  dataset: "Trajectories/fr3_finray_table_right_can_spice_damped_noise.hdf5"
  demo: null
  obs_key: "state"
  action_mode: "absolute_ee"
  time_shift: 0
  val_fraction: 0.1
  split_mode: "random"
  seed: 1999

preprocessing:
  action_chunk_size: 15
  action_chunk_stride: 1
  obs_history: 1

model:
  hidden_dims: [2048, 1024, 512, 1024, 2048]
  activation: "relu"
  negative_slope: 0.01
  dropout: 0.1

optimization:
  lr: 1.0e-5
  weight_decay: 1.0e-5
  batch_size: 1024
  num_workers: 8
  num_epochs: 300
  save_every_n_epochs: 50
  grad_clip: 10.0

logging:
  log_dir: "resources/experiment_definitions/fr3_finray/ablation/prior_variants/logs/right_can_chunking_15_ff_damped_stage"
  monitor_demo_index: null

auto_shift:
  epochs: 50
  batch_size: 512

sample_weighting:
  enabled: true
  obs_stage_index: -1
  default_weight: 1.0
  normalize: true
  weight_validation: true
  stage_weights: {}

critic_pretraining:
  enabled: false
  gamma: 0.99
  loss_coef: 1.0
  normalize_targets: true

