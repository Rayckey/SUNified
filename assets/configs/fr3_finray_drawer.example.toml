schema_version = 1

[workspace]
# Relative paths resolve from the unified project root. Override with ISAACLAB_ROOT.
isaaclab_root = ".."
# Empty means the interpreter running kuafu. An absolute conda Python path
# is preferable for unattended jobs.
python = ""
# Override with KUAFU_ARTIFACT_ROOT for a mounted or remote-backed location.
artifact_root = "../KuafuArtifacts"
gpus = [0, 1, 2, 3]

[task]
slug = "fr3_finray_drawer"
task_name = "FR3-FinRay-Table-Drawer"
robot_name = "fr3_finray"
robot_id = "fr3_finray"

[learn_programs]
# Formulation always uses the program-free Panda Drawer scene.
# task.robot_id above selects the downstream collection/evaluation robot.
# This example reuses two validated snapshot programs below. Set enabled=true and
# clear collect.program_paths to generate a fresh learned program first.
enabled = false
script = "src/kuafu/programs/fr3_finray_drawer_learn_programs.py"
output_env = "manipulation-fr3-finray-drawer"
args = ["--num_envs", "1", "--headless"]

[collect]
program_paths = [
  "resources/learned_programs/manipulation-fr3-finray-drawer/2026-07-02_20-31-54",
  "resources/learned_programs/manipulation-fr3-finray-drawer/2026-07-29_07-43-50",
]
successful_demos_per_program = 400
workers_per_gpu_per_program = 1
base_seeds = [110000, 120000]
parallel_programs = true
worker_stagger_sec = 8.0
program_start_offset_sec = 4.0
cpu_threads_per_worker = 8
control_output_mode = "absolute_ee"
action_noise_std = 0.003
keep_intermediates = false
dataset = ""
extra_args = []

[prior]
dataset = ""
task_slug = "drawer"
run_name = "first2_programs_mpc800"
name_prefix = "drawer_first2_programs_mpc800"
artifact_root = ""
obs_key = "state"
action_mode = "absolute_ee"
time_shift = 0
chunk_sizes = [10, 15, 30]
chunk_strides = [1, 3]
variants = ["f", "ff", "fff", "f3", "ff3", "fff3"]
num_epochs = 150
bc_num_workers = 0
pin_memory = false
sample_weighting = true
sample_weighting_validation = true
workers_per_gpu = 2
stagger_sec = 3.0

[eval]
# A pooled dataset needs an explicit selection. Residual RL uses this same program.
# Clear this when switching to a newly formulated, single-program run.
program_path = "resources/learned_programs/manipulation-fr3-finray-drawer/2026-07-02_20-31-54"
params_path = ""
csv = ""
duration_sec = 180.0
num_envs = 8192
chunk_exec = 1
success_rate_col = "success_rate"
conda_env = ""
skip_parameter_search = false
acquire_weights = true

[residual]
weights_params = ""
launcher = ""
selection_policy = "smallest_class_over_threshold"
success_threshold = 20.0
model_class_order = ["bc", "class", "ff3", "ff", "fff3", "fff", "f3", "f"]
execute = true

[residual.env]
RESIDUAL_CUDA_VISIBLE_DEVICES = "0,1,2,3"
RESIDUAL_DEVICE = "cuda:0,1,2,3"
