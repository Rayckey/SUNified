[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuafu"
version = "0.7.0"
description = "Kuafu: the agentic robot-learning harness for SUN Programs"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "SUN project contributors"}]
dependencies = []

[project.urls]
Homepage = "https://kuafu-robo.github.io/"
Paper = "https://arxiv.org/abs/2608.31167"
Repository = "https://github.com/Rayckey/SUNified"
Issues = "https://github.com/Rayckey/SUNified/issues"
Documentation = "https://github.com/Rayckey/SUNified/blob/master/docs/INSTALL.md"

